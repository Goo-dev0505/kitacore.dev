<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMPT ATLAS — KITAcore Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PROMPT ATLAS — KITAcore Edition
   Design: Architectural Minimalism × Light Mode
========================================================= */

:root {
  --bg:           #E9E9E9;
  --surface:      #FFFFFF;
  --surface-v:    #F4F4F2;
  --surface-hov:  #EFEFED;
  --text:         #111111;
  --text-sub:     #333333;
  --muted:        #6B6B6B;
  --border:       #DDDDDD;
  --border-light: #CCCCCC;
  --accent:       #000000;
  --accent-dim:   rgba(0,0,0,0.06);
  --accent-glow:  rgba(0,0,0,0.04);
  --red:          #CC2200;
  --green:        #007744;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;

  --font-display: 'Anton', 'Inter', sans-serif;
  --font-body:    'Noto Sans JP', sans-serif;
  --font-mono:    'JetBrains Mono', 'Space Mono', monospace;
  --font-inter:   'Inter', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #BBBBBB; border-radius: 2px; }

/* =========================================================
   HEADER
========================================================= */
.pa-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(233,233,233,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-8);
  height: 56px;
}

.pa-header-left {
  display: flex;
  align-items: center;
  gap: var(--sp-6);
}

.pa-nav-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.pa-logo {
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 0.06em;
  color: var(--text);
}

.pa-logo span {
  color: var(--accent);
}

.pa-version {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  padding: 2px 6px;
  border: 1px solid var(--border-light);
  border-radius: 2px;
}

.pa-tabs {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px;
}

.pa-tab {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 6px 14px;
  border: none;
  border-radius: 2px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 150ms ease;
}

.pa-tab.is-active {
  background: var(--accent);
  color: #fff;
}

.pa-tab:hover:not(.is-active) {
  color: var(--text-sub);
  background: var(--surface-v);
}

/* =========================================================
   LAYOUT
========================================================= */
.pa-layout {
  display: grid;
  grid-template-columns: 220px 1fr 300px;
  height: calc(100vh - 56px);
}

/* ── Sidebar ── */
.pa-side {
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pa-side-inner {
  overflow-y: auto;
  flex: 1;
  padding: var(--sp-4);
}

.pa-search-wrap {
  padding: var(--sp-4);
  border-bottom: 1px solid var(--border);
}

.pa-search {
  width: 100%;
  background: var(--surface-v);
  border: 1px solid var(--border-light);
  border-radius: 2px;
  padding: 8px 12px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
  transition: border-color 150ms ease;
}

.pa-search:focus { border-color: var(--accent); }
.pa-search::placeholder { color: var(--muted); }

.pa-side-section {
  margin-bottom: var(--sp-4);
}

.pa-side-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: var(--sp-2);
  padding: 0 var(--sp-2);
}

.pa-cat-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 6px var(--sp-2);
  border: none;
  border-radius: 2px;
  background: transparent;
  color: var(--text-sub);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: all 150ms ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.pa-cat-btn:hover { background: var(--surface-hov); color: var(--text); }

.pa-cat-btn.is-active {
  background: var(--accent);
  color: #fff;
}

.pa-cat-count { color: var(--muted); }
.pa-cat-btn.is-active .pa-cat-count { color: rgba(255,255,255,0.6); }

/* ── Main ── */
.pa-main {
  overflow-y: auto;
  padding: var(--sp-6);
  display: flex;
  flex-direction: column;
  gap: var(--sp-6);
}

.pa-main-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: var(--sp-4);
}

.pa-main-head-left { }

.pa-main-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.pa-main-title {
  font-family: var(--font-inter);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}

.pa-main-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
}

/* ── Card Grid ── */
.pa-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--sp-3);
}

.pa-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  transition: border-color 150ms ease;
}

.pa-card:hover { border-color: var(--border-light); }

.pa-card-cat {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}

.pa-card-name {
  font-family: var(--font-inter);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.pa-card-desc {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.6;
  flex: 1;
}

.pa-card-prompt {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-sub);
  background: var(--surface-v);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 4px 8px;
  word-break: break-all;
}

.pa-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.pa-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-v);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 5px;
}

.pa-card-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}

/* ── Buttons ── */
.pa-btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 7px 10px;
  border-radius: 2px;
  border: 1px solid var(--border-light);
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
}

.pa-btn:hover { background: var(--surface-v); color: var(--text); border-color: var(--accent); }

.pa-btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}

.pa-btn-primary:hover {
  background: #333333;
  border-color: #333333;
  color: #fff;
}

.pa-btn-full {
  grid-column: 1 / -1;
}

.pa-btn-danger {
  border-color: var(--red);
  color: var(--red);
}
.pa-btn-danger:hover { background: rgba(255,68,68,0.08); }

.pa-btn-success {
  border-color: var(--green);
  color: var(--green);
  background: rgba(0,255,136,0.08);
}

/* ── Builder (Right) ── */
.pa-builder {
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pa-builder-head {
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.pa-builder-title {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.08em;
  color: var(--text);
}

.pa-builder-clear {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 2px;
  transition: all 150ms ease;
}
.pa-builder-clear:hover { color: var(--red); background: rgba(255,68,68,0.08); }

.pa-builder-items {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.pa-builder-empty {
  text-align: center;
  padding: var(--sp-8) var(--sp-4);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  font-family: var(--font-mono);
}

.pa-builder-item {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 8px 10px;
  transition: border-color 150ms ease;
}
.pa-builder-item:hover { border-color: var(--border-light); }

.pa-builder-item-body { flex: 1; min-width: 0; }

.pa-builder-item-name {
  font-family: var(--font-inter);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.pa-builder-item-prompt {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  word-break: break-all;
}

.pa-builder-item-remove {
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0 2px;
  line-height: 1;
  flex-shrink: 0;
  margin-top: 2px;
  transition: color 150ms ease;
}
.pa-builder-item-remove:hover { color: var(--red); }

.pa-builder-output {
  border-top: 1px solid var(--border);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  flex-shrink: 0;
}

.pa-output-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.pa-output-text {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-sub);
  background: var(--surface-v);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 10px 12px;
  line-height: 1.7;
  word-break: break-all;
  min-height: 80px;
  resize: none;
  width: 100%;
  outline: none;
}

.pa-output-actions {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

/* ── PARAMS Config ── */
.pa-params {
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.pa-params-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
}

.pa-param-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.pa-param-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.pa-param-input {
  background: var(--surface-v);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 5px 8px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  outline: none;
  width: 100%;
  transition: border-color 150ms ease;
}
.pa-param-input:focus { border-color: var(--accent); }

/* ── Toast ── */
.pa-toast {
  position: fixed;
  bottom: var(--sp-6);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 2px;
  padding: 10px 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--accent);
  z-index: 9999;
  opacity: 0;
  transition: all 300ms ease;
  pointer-events: none;
}

.pa-toast.is-show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Empty state ── */
.pa-no-result {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--sp-12) var(--sp-8);
  gap: var(--sp-3);
  color: var(--muted);
  text-align: center;
}

.pa-no-result-icon { font-size: 32px; opacity: 0.3; }

.pa-no-result-text {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.1em;
  line-height: 1.8;
}

/* ── Builder count badge ── */
.pa-builder-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  background: var(--accent);
  color: #fff;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  border-radius: 9px;
  padding: 0 5px;
  margin-left: 4px;
}

.pa-builder-badge:empty { display: none; }

/* ── Reverse tab content ── */
.pa-reverse-content {
  display: none;
  padding: var(--sp-6);
}

.pa-reverse-content.is-active {
  display: block;
}

.pa-reverse-input-wrap {
  display: flex;
  gap: var(--sp-3);
  margin-bottom: var(--sp-6);
}

.pa-reverse-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 2px;
  padding: 10px 14px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  transition: border-color 150ms ease;
}
.pa-reverse-input:focus { border-color: var(--accent); }
.pa-reverse-input::placeholder { color: var(--muted); }

/* ── Tab content panels ── */
.pa-panel { display: none; }
.pa-panel.is-active { display: flex; }

.pa-dict-panel {
  height: 100%;
  overflow: hidden;
}

/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 1024px) {
  .pa-layout {
    grid-template-columns: 180px 1fr 260px;
  }
}

@media (max-width: 768px) {
  .pa-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    height: auto;
  }

  .pa-side {
    border-right: none;
    border-bottom: 1px solid var(--border);
    max-height: 200px;
  }

  .pa-builder {
    border-left: none;
    border-top: 1px solid var(--border);
  }

  .pa-header {
    padding: 0 var(--sp-4);
    flex-wrap: wrap;
    height: auto;
    min-height: 56px;
    padding-top: var(--sp-2);
    padding-bottom: var(--sp-2);
    gap: var(--sp-2);
  }

  .pa-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
}
</style>
</head>
<body>

<!-- =========================================================
     HEADER
========================================================= -->
<header class="pa-header">
  <div class="pa-header-left">
    <span class="pa-nav-label">01. TOOL</span>
    <div class="pa-logo">PROMPT <span>ATLAS</span></div>
    <span class="pa-version">v1.0</span>
  </div>
  <div class="pa-tabs" id="mainTabs">
    <button class="pa-tab is-active" data-panel="dict">辞典</button>
    <button class="pa-tab" data-panel="reverse">逆引き</button>
  </div>
</header>

<!-- =========================================================
     DICT PANEL
========================================================= -->
<div class="pa-panel is-active pa-dict-panel" id="panel-dict">
  <div class="pa-layout">

    <!-- Sidebar -->
    <aside class="pa-side">
      <div class="pa-search-wrap">
        <input class="pa-search" id="searchInput" type="search" placeholder="日本語で検索..." autocomplete="off">
      </div>
      <div class="pa-side-inner">
        <div class="pa-side-section">
          <div class="pa-side-label">CATEGORY</div>
          <div id="catList"></div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="pa-main" id="paMain">
      <div class="pa-main-head">
        <div class="pa-main-head-left">
          <div class="pa-main-eyebrow" id="mainCatLabel">PROMPT DICTIONARY</div>
          <div class="pa-main-title" id="mainTitle">辞典一覧</div>
        </div>
        <span class="pa-main-count" id="mainCount">— items</span>
      </div>
      <div class="pa-grid" id="cardGrid"></div>
    </main>

    <!-- Builder -->
    <aside class="pa-builder">
      <div class="pa-builder-head">
        <div class="pa-builder-title">
          BUILDER <span class="pa-builder-badge" id="builderBadge"></span>
        </div>
        <button class="pa-builder-clear" id="btnClear">ALL CLEAR</button>
      </div>

      <div class="pa-builder-items" id="builderItems">
        <div class="pa-builder-empty" id="builderEmpty">
          カードを追加すると<br>ここに並びます
        </div>
      </div>

      <div class="pa-params">
        <div class="pa-output-label">PARAMS</div>
        <div class="pa-params-grid">
          <div class="pa-param-group">
            <label class="pa-param-label">AR</label>
            <input class="pa-param-input" id="paramAR" value="9:16">
          </div>
          <div class="pa-param-group">
            <label class="pa-param-label">STYLIZE</label>
            <input class="pa-param-input" id="paramStylize" value="250">
          </div>
          <div class="pa-param-group">
            <label class="pa-param-label">CHAOS</label>
            <input class="pa-param-input" id="paramChaos" value="8">
          </div>
          <div class="pa-param-group">
            <label class="pa-param-label">VERSION</label>
            <input class="pa-param-input" id="paramVersion" value="6.1">
          </div>
        </div>
      </div>

      <div class="pa-builder-output">
        <div class="pa-output-label">GENERATED PROMPT</div>
        <textarea class="pa-output-text" id="outputText" readonly rows="5"></textarea>
        <div class="pa-output-actions">
          <button class="pa-btn pa-btn-primary" id="btnCopy">COPY PROMPT</button>
          <button class="pa-btn" id="btnReset">RESET PARAMS</button>
        </div>
      </div>
    </aside>

  </div>
</div>

<!-- =========================================================
     REVERSE PANEL
========================================================= -->
<div class="pa-panel" id="panel-reverse" style="padding: var(--sp-6); flex-direction: column; gap: var(--sp-6);">
  <div style="max-width: 600px; margin: 0 auto; width: 100%;">
    <div class="pa-main-eyebrow">REVERSE LOOKUP</div>
    <div class="pa-main-title" style="margin-bottom: var(--sp-6);">英語から逆引き</div>
    <div class="pa-reverse-input-wrap">
      <input class="pa-reverse-input" id="reverseInput" type="text" placeholder="英語プロンプト（例: cyberpunk city）を入力...">
      <button class="pa-btn pa-btn-primary" id="btnReverse">検索</button>
    </div>
    <div id="reverseResult"></div>
  </div>
</div>

<!-- Toast -->
<div class="pa-toast" id="toast"></div>

<!-- =========================================================
     DATA + LOGIC
========================================================= -->
<script>
// =========================================================
//  PROMPT DATA
// =========================================================

let state = {

// =========================================================

// =========================================================
const $catList     = document.getElementById('catList');
const $cardGrid    = document.getElementById('cardGrid');
const $mainCount   = document.getElementById('mainCount');
const $mainCatLabel= document.getElementById('mainCatLabel');
const $mainTitle   = document.getElementById('mainTitle');
const $builderItems= document.getElementById('builderItems');

const $toast       = document.getElementById('toast');
const $paramAR     = document.getElementById('paramAR');
const $paramStylize= document.getElementById('paramStylize');
const $paramChaos  = document.getElementById('paramChaos');
const $paramVersion= document.getElementById('paramVersion');

// =========================================================
//  INIT
// =========================================================
function init() {
  buildCatList();
  renderCards();
  renderBuilder();
  updateOutput();

  // search
  $searchInput.addEventListener('input', (e) => {
    state.query = e.target.value.trim();
    renderCards();
  });

  // params
  $paramAR.addEventListener('input', () => { state.params.ar = $paramAR.value; updateOutput(); });
  $paramStylize.addEventListener('input', () => { state.params.stylize = $paramStylize.value; updateOutput(); });
  $paramChaos.addEventListener('input', () => { state.params.chaos = $paramChaos.value; updateOutput(); });
  $paramVersion.addEventListener('input', () => { state.params.version = $paramVersion.value; updateOutput(); });

  // copy
  document.getElementById('btnCopy').addEventListener('click', () => {
    copyText($outputText.value);
  });

  // clear
  document.getElementById('btnClear').addEventListener('click', () => {
    state.builder = [];
    renderBuilder();
    updateOutput();
  });

  // reset params
  document.getElementById('btnReset').addEventListener('click', () => {
    state.params = { ar:'9:16', stylize:'250', chaos:'8', version:'6.1' };
    $paramAR.value = '9:16';
    $paramStylize.value = '250';
    $paramChaos.value = '8';
    $paramVersion.value = '6.1';
    updateOutput();
  });

  // tabs
  document.getElementById('mainTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.pa-tab');
    if (!btn) return;
    const panel = btn.dataset.panel;
    document.querySelectorAll('.pa-tab').forEach(t => t.classList.remove('is-active'));
    btn.classList.add('is-active');
    document.querySelectorAll('.pa-panel').forEach(p => p.classList.remove('is-active'));
    document.getElementById('panel-' + panel).classList.add('is-active');
  });

  // reverse lookup
  document.getElementById('btnReverse').addEventListener('click', reverseSearch);
  document.getElementById('reverseInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') reverseSearch();
  });
}

// =========================================================
//  BUILD CATEGORY LIST
// =========================================================
function buildCatList() {
  $catList.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = cat.key === 'all'
      ? PROMPT_DATA.length
      : PROMPT_DATA.filter(d => d.cat === cat.key).length;

    const btn = document.createElement('button');
    btn.className = 'pa-cat-btn' + (cat.key === state.cat ? ' is-active' : '');
    btn.dataset.cat = cat.key;
    btn.innerHTML = `<span>${cat.label}</span><span class="pa-cat-count">${count}</span>`;
    btn.addEventListener('click', () => {
      state.cat = cat.key;
      document.querySelectorAll('.pa-cat-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      updateMainHead();
      renderCards();
    });
    $catList.appendChild(btn);
  });
}

function updateMainHead() {
  const catInfo = CATEGORIES.find(c => c.key === state.cat);
  if (state.cat === 'all') {
    $mainCatLabel.textContent = 'PROMPT DICTIONARY';
    $mainTitle.textContent = '辞典一覧';
  } else {
    $mainCatLabel.textContent = catInfo.key.toUpperCase();
    $mainTitle.textContent = catInfo.label;
  }
}

// =========================================================
//  RENDER CARDS
// =========================================================
function renderCards() {
  const q = state.query.toLowerCase();
  let filtered = PROMPT_DATA;

  if (state.cat !== 'all') {
    filtered = filtered.filter(d => d.cat === state.cat);
  }

  if (q) {
    filtered = filtered.filter(d =>
      d.name.toLowerCase().includes(q) ||
      d.desc.toLowerCase().includes(q) ||
      d.tags.some(t => t.toLowerCase().includes(q)) ||
      d.prompt.toLowerCase().includes(q)
    );
  }

  $mainCount.textContent = `${filtered.length} items`;

  if (filtered.length === 0) {
    $cardGrid.innerHTML = `
      <div class="pa-no-result" style="grid-column:1/-1">
        <div class="pa-no-result-icon">⌀</div>
        <div class="pa-no-result-text">「${state.query}」に一致するプロンプトが見つかりません</div>
      </div>`;
    return;
  }

  $cardGrid.innerHTML = filtered.map(item => `
    <article class="pa-card">
      <div class="pa-card-cat">${item.catLabel}</div>
      <div class="pa-card-name">${item.name}</div>
      <div class="pa-card-desc">${item.desc}</div>
      <div class="pa-card-prompt">${item.prompt}</div>
      <div class="pa-card-tags">${item.tags.map(t => `<span class="pa-tag">${t}</span>`).join('')}</div>
      <div class="pa-card-actions">
        <button class="pa-btn pa-btn-primary" data-add="${item.id}">＋ Builder</button>
        <button class="pa-btn" data-copy="${item.prompt}">コピー</button>
      </div>
    </article>
  `).join('');

  // card action events
  $cardGrid.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => addToBuilder(btn.dataset.add));
  });
  $cardGrid.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn.dataset.copy));
  });
}

// =========================================================
//  BUILDER
// =========================================================
function addToBuilder(id) {
  if (state.builder.includes(id)) {
    showToast('既に追加済みです');
    return;
  }
  state.builder.push(id);
  renderBuilder();
  updateOutput();
  showToast('Builder に追加しました');
}

function removeFromBuilder(id) {
  state.builder = state.builder.filter(i => i !== id);
  renderBuilder();
  updateOutput();
}

function renderBuilder() {
  $builderBadge.textContent = state.builder.length || '';

  if (state.builder.length === 0) {
    $builderEmpty.style.display = 'block';
    $builderItems.querySelectorAll('.pa-builder-item').forEach(el => el.remove());
    return;
  }

  $builderEmpty.style.display = 'none';

  // clear existing items
  $builderItems.querySelectorAll('.pa-builder-item').forEach(el => el.remove());

  state.builder.forEach(id => {
    const item = PROMPT_DATA.find(d => d.id === id);
    if (!item) return;

    const el = document.createElement('div');
    el.className = 'pa-builder-item';
    el.dataset.id = id;
    el.innerHTML = `
      <div class="pa-builder-item-body">
        <div class="pa-builder-item-name">${item.name}</div>
        <div class="pa-builder-item-prompt">${item.prompt}</div>
      </div>
      <button class="pa-builder-item-remove" data-remove="${id}">✕</button>
    `;
    el.querySelector('[data-remove]').addEventListener('click', () => removeFromBuilder(id));
    $builderItems.appendChild(el);
  });
}

function updateOutput() {
  const prompts = state.builder
    .map(id => PROMPT_DATA.find(d => d.id === id)?.prompt)
    .filter(Boolean);

  const p = state.params;
  let output = '';

  if (prompts.length > 0) {
    output = prompts.join(', ') + ', ultra detailed, high quality, sharp focus';
  } else {
    output = 'A beautiful character in a cinematic scene., ultra detailed, high quality, sharp focus';
  }

  const flags = [];
  if (p.ar)       flags.push(`--ar ${p.ar}`);
  if (p.stylize)  flags.push(`--stylize ${p.stylize}`);
  if (p.chaos)    flags.push(`--chaos ${p.chaos}`);
  if (p.version)  flags.push(`--v ${p.version}`);

  if (flags.length) output += ' ' + flags.join(' ');

  $outputText.value = output;
}

// =========================================================
//  REVERSE SEARCH
// =========================================================
function reverseSearch() {
  const q = document.getElementById('reverseInput').value.trim().toLowerCase();
  const $result = document.getElementById('reverseResult');

  if (!q) {
    $result.innerHTML = '';
    return;
  }

  const hits = PROMPT_DATA.filter(d =>
    d.prompt.toLowerCase().includes(q)
  );

  if (hits.length === 0) {
    $result.innerHTML = `<div style="color:var(--muted);font-family:var(--font-mono);font-size:12px;padding:var(--sp-4) 0;">「${q}」に一致するプロンプトが見つかりません</div>`;
    return;
  }

  $result.innerHTML = `
    <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--sp-3);">${hits.length} results</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${hits.map(item => `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px 14px;display:flex;align-items:center;gap:12px;">
          <div style="flex:1;">
            <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">${item.catLabel}</div>
            <div style="font-family:var(--font-inter);font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;">${item.name}</div>
            <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-sub);">${item.prompt}</div>
          </div>
          <button class="pa-btn pa-btn-primary" data-add="${item.id}" style="flex-shrink:0;">＋ Builder</button>
        </div>
      `).join('')}
    </div>
  `;

  $result.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => addToBuilder(btn.dataset.add));
  });
}

// =========================================================
//  COPY
// =========================================================
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => showToast('コピーしました'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('コピーしました');
  } catch {
    showToast('コピーに失敗しました');
  }
  document.body.removeChild(ta);
}

// =========================================================
//  TOAST
// =========================================================
let toastTimer;
function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('is-show'), 2000);
}

// =========================================================
//  BOOT
// =========================================================
init();
</script>
</body>
</html>
